name: Release builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for the release (e.g. v0.2.0). Leave empty to build without publishing.'
        required: false
        default: ''

env:
  PKG_NAME: emulator-sun-2
  PKG_DESCRIPTION: "Sun-2 workstation emulator (68010 + bwtwo + SCSI)"

jobs:
  # -------------------------------------------------------------------
  # Windows x64 (MSYS2 MinGW-w64)
  # -------------------------------------------------------------------
  build-windows:
    name: Build windows-x64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (MINGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            unzip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-SDL2

      - name: Show toolchain versions
        run: |
          gcc --version | head -1
          make --version | head -1
          pkg-config --modversion sdl2

      - name: Download Npcap SDK
        run: |
          set -e
          # Npcap SDK gives us wpcap.lib + headers compatible with libpcap.
          # The runtime DLL ships separately as the Npcap installer.
          curl -fsSL -o npcap-sdk.zip https://npcap.com/dist/npcap-sdk-1.13.zip
          mkdir -p npcap-sdk
          unzip -q npcap-sdk.zip -d npcap-sdk

      - name: Build release
        env:
          NPCAP_SDK: ${{ github.workspace }}\npcap-sdk
        run: |
          set -e
          # MSYS2 sees the path with backslashes; convert.
          export NPCAP_SDK="$(cygpath -u "$NPCAP_SDK")"
          make NET_BACKEND=pcap release

      - name: Stage release artifacts
        run: |
          set -e
          STAGE="dist/emulator-sun-2-windows-x64"
          mkdir -p "$STAGE"
          cp sim/sim.exe "$STAGE/"
          cp /mingw64/bin/SDL2.dll "$STAGE/SDL2.dll"
          cp README.md "$STAGE/" 2>/dev/null || true
          cp COPYING "$STAGE/" 2>/dev/null || true
          # Note about Npcap runtime requirement.
          cat > "$STAGE/NETWORKING.txt" <<'EOF'
          The 3C400 Ethernet emulation in this build uses Npcap.
          To get a working emulated network you must install the Npcap
          runtime separately from https://npcap.com/ (with "WinPcap API
          compatible" mode enabled).

          Without Npcap installed, the emulator still runs but no
          packets will flow through the 3C400.
          EOF

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: emulator-sun-2-windows-x64
          path: dist/emulator-sun-2-windows-x64/
          if-no-files-found: error

  # -------------------------------------------------------------------
  # Linux x64
  # -------------------------------------------------------------------
  build-linux:
    name: Build linux-x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libsdl2-dev libpcap-dev

      - name: Show toolchain versions
        run: |
          gcc --version | head -1
          make --version | head -1
          pkg-config --modversion sdl2
          pkg-config --modversion libpcap || true

      - name: Build release
        run: make NET_BACKEND=pcap release

      - name: Stage release artifacts
        run: |
          set -e
          STAGE="dist/emulator-sun-2-linux-x64"
          mkdir -p "$STAGE"
          cp sim/sim "$STAGE/"
          cp README.md "$STAGE/" 2>/dev/null || true
          cp COPYING "$STAGE/" 2>/dev/null || true
          cat > "$STAGE/NETWORKING.txt" <<'EOF'
          The 3C400 Ethernet uses libpcap.  Make sure libpcap is
          installed at runtime (apt: libpcap0.8) and that the user
          running the emulator has CAP_NET_RAW or has been added to
          a group that can open raw sockets via pcap_open_live().
          EOF
          cd dist
          tar czf emulator-sun-2-linux-x64.tar.gz emulator-sun-2-linux-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emulator-sun-2-linux-x64
          path: dist/emulator-sun-2-linux-x64.tar.gz
          if-no-files-found: error

  # -------------------------------------------------------------------
  # macOS arm64 (Apple Silicon)
  # -------------------------------------------------------------------
  build-macos:
    name: Build macos-arm64
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SDL2
        run: brew install sdl2

      - name: Build release
        # macOS uses the BPF backend by default; libpcap is preinstalled
        # in /usr/lib but we don't need it for the BPF build.
        run: make release

      - name: Stage release artifacts
        run: |
          set -e
          STAGE="dist/emulator-sun-2-macos-arm64"
          mkdir -p "$STAGE"
          cp sim/sim "$STAGE/"
          cp README.md "$STAGE/" 2>/dev/null || true
          cp COPYING "$STAGE/" 2>/dev/null || true
          cat > "$STAGE/NETWORKING.txt" <<'EOF'
          The 3C400 Ethernet uses /dev/bpf*.  You'll need read/write
          access to a /dev/bpf* node — typically by chmod'ing it or
          adding your user to the 'access_bpf' group.  Do NOT run the
          emulator as root.
          EOF
          cd dist
          tar czf emulator-sun-2-macos-arm64.tar.gz emulator-sun-2-macos-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emulator-sun-2-macos-arm64
          path: dist/emulator-sun-2-macos-arm64.tar.gz
          if-no-files-found: error

  # -------------------------------------------------------------------
  # Publish a GitHub Release on tag push
  # -------------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Re-zip Windows artifact directory
        # Windows is uploaded as a directory (to avoid double-zipping by
        # actions/upload-artifact); rebuild a clean .zip for the release.
        run: |
          set -e
          cd dist
          for d in */; do
            name="${d%/}"
            if ls "$d"*.exe >/dev/null 2>&1; then
              zip -r "${name}.zip" "$name"
            fi
          done

      - name: List artifacts
        run: find dist -maxdepth 2 -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/**/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
